<!doctype html>
<html lang="ca">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora modular amb Vite</title>
  </head>
  <body>
    <div id="app" style="max-width: 640px; margin: 2rem auto; font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;">
      <h1>Calculadora modular</h1>
      <form id="calc-form" style="display:flex; gap:.5rem; flex-wrap: wrap; align-items: center;">
        <input type="number" id="a" required step="any" placeholder="Primer número" style="flex:1; min-width: 8rem; padding:.5rem;">
        <select id="op" style="padding:.5rem;">
          <option value="suma">+</option>
          <option value="resta">−</option>
          <option value="multiplica">×</option>
          <option value="divideix">÷</option>
        </select>
        <input type="number" id="b" required step="any" placeholder="Segon número" style="flex:1; min-width: 8rem; padding:.5rem;">
        <button type="submit" style="padding:.6rem 1rem;">Calcula</button>
      </form>
      <p id="resultat" aria-live="polite" style="margin-top:1rem; font-size:1.125rem;"></p>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>

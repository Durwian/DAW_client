<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex1</title>
    <style>
        body {
            font-family: "Segoe UI", Roboto, sans-serif;
            background-color: #f4f6f8;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            max-width: 600px;
            height: 180px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            line-height: 1.5;
            resize: vertical;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        textarea:focus {
            border-color: #0078d7;
            box-shadow: 0 0 4px rgba(0, 120, 215, 0.3);
            outline: none;
        }

        button {
            margin-top: 16px;
            padding: 10px 18px;
            font-size: 16px;
            background-color: #0078d7;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: #005fa3;
        }

        button:active {
            transform: scale(0.98);
        }

        #resultat {
            background: white;
            border-radius: 8px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
            padding: 20px;
            margin-top: 30px;
            width: 100%;
            max-width: 600px;
        }

        #resultat h3 {
            margin-top: 0;
            color: #0078d7;
        }

        #resultat ul {
            list-style: none;
            padding: 0;
        }

        #resultat li {
            margin: 8px 0;
            padding-left: 8px;
        }

        strong {
            color: #2c3e50;
        }
    </style>
</head>

<body>
    <textarea id="text" cols="30" rows="10"></textarea>
    <button onclick="analitzar()">Analitza</button>
    <div id="resultat"></div>

    <script>
       // Escriu aquí el teu codi
        let text = document.getElementById("text").value;
        let resultat = document.getElementById("resultat");
        function analitzar(){
            let caracters = text.length;
            let paraules = text.split(" ");
            let comptador = [];
            let repetides = [];
            let resultats = [caracters, paraules, repetides];
            console.log("Caracters: " + caracters);
            console.log("Paraules: " + paraules.length);

            for(let paraula of paraules){
                if(comptador[paraula] === undefined){
                    comptador[paraula] = 1;
                }else{
                    comptador[paraula]++;
                }
            }
            console.log(comptador);
            for(let p in comptador){
                if(comptador[p] > 1){
                    repetides.push(p);
                } 
            }
            console.log(repetides);
        
        resultat.innerHTML = `
            <h3>Resultats</h3>
                <ul>
                    <li><strong>Caràcters:</strong> ${caracters}</li>
                    <li><strong>Paraules totals:</strong> ${paraules.length}</li>
                    <li><strong>Paraules repetides:</strong>
                        ${repetides.length > 0 ? repetides.join(", ") : "Cap"}
                    </li>
                </ul>
            `;
        }
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex2</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 700px;
            margin: 2rem auto;
            line-height: 1.4;
        }

        label {
            display: block;
            margin-top: .75rem;
        }

        input {
            padding: .4rem .6rem;
            margin-top: .25rem;
        }

        .btns {
            display: flex;
            gap: .5rem;
            margin: 1rem 0;
            flex-wrap: wrap;
        }

        button {
            padding: .5rem .8rem;
            cursor: pointer;
        }

        #resultat ul {
            padding-left: 1.2rem;
        }
    </style>
</head>

<body>
    <h1>Petit planificador d'alarmes</h1>

    <label for="hora">Hora de l'alarma</label>
    <input type="time" id="hora" />

    <label for="dies">Dies consecutius</label>
    <input type="number" id="dies" min="1" value="1" />

    <div class="btns">
        <button id="programa" onclick="programa()">Programa</button>
        <button id="llista" onclick="llista()">Llista alarmes</button>
        <button id="esborra" onclick="esborraTotes()">Esborra totes</button>
    </div>

    <div id="resultat"></div>

    <script>
        let alarmes = llegirJSON(JSON.parse(localStorage.getItem("alarmes") || "[]"));
        let resultat = document.getElementById("resultat");
        console.log(alarmes);
        setInterval(llista, 60000);
        function programa(){
            const alarmaProgramada = document.getElementById("hora").value.split(":");
            if(alarmaProgramada[1] == null){
                alert("Cal posar l'hora de l'alarma.");
                return;
            }
            const dies = Number(document.getElementById("dies").value);
            const dataActual = new Date(Date.now());
            let alarma = new Date(dataActual.getTime());
            alarma.setHours(alarmaProgramada[0],alarmaProgramada[1]);

            
            console.log("Alarma programada: " + alarmaProgramada[0] + ":" + alarmaProgramada[1]);
            console.log("Data i hora actual: " + dataActual);

            if(alarma <= dataActual){
                console.log("GetTime: " + alarma.getTime())
                alarma.setTime(alarma.getTime() + (24 * 60 * 60 * 1000));
            }
            console.log(alarma);

            for(let i = 0; i < dies; i++){
                alarmes.push(alarma);
                if(dies > 1){
                    alarma = new Date(alarma.getTime() + (24 * 60 * 60 * 1000));
                }
            }

            llista();
            localStorage.setItem("alarmes", JSON.stringify(alarmes));
            console.log(alarmes);
            ;
        }
        
        function llista(){
            let html = "<ul>";
            let aux = new Date();
            alarmes.sort((a, b) => new Date(a) - new Date(b))
            for(let alarma of alarmes){
                console.log("Data alarma->" + alarma)
                aux = new Date(alarma.getTime() - new Date(Date.now()).getTime());
                html += `<li> ${dataFormat(alarma)}   ${alarma.getHours()}:${alarma.getMinutes().toString().padEnd(2,"0")}  -  falta ${aux.getDate()} dies, ${aux.getHours()} hores i ${aux.getMinutes()} minuts </li>`;
            }
            html += "</ul>";

            resultat.innerHTML = html;
        }

        function esborraTotes(){
            localStorage.clear();
            alarmes = [];
            resultat.innerHTML = "No hi ha alarmes programades";
        }

        function dataFormat(dataFormatar){
            let dia = dataFormatar.getDate();
            let mes = dataFormatar.getMonth() + 1;
            let any = dataFormatar.getFullYear();

            return `${dia}/${mes}/${any}`;
        }

        function llegirJSON(alarmes){
            if(alarmes){
                for(let i=0;i < alarmes.length; i ++){
                    alarmes[i] = new Date(alarmes[i]);
                }
                return alarmes;
            }
            return null;
        }
        
    </script>
</body>

</html>

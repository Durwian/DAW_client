<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex3</title>
</head>

<body>
    <script>
        /**** Escriu aquí el teu codi ****/
        let preu;

        while(isNaN(preu)){ //validació del preu introduït per l'usuari
            preu = parseFloat(window.prompt("Quin preu posem?"));
            if(isNaN(preu)){alert("Cal escriure un valor numèric")}
        }

        // Funció aplicarIva: que calculi i retorni el valor sumant-li un 21% d'IVA.
        const aplicarIva = function(preu){return preu * 0.21;};

        //aplicarDescompte: que apliqui un descompte del 10%
        const aplicarDescompte = () => preu * 0.1;

        // Mostra per consola
        console.log(preu);
        console.log((aplicarIva(preu) + preu));
        console.log((preu - aplicarDescompte()));
        console.log((preu + aplicarIva(preu) + aplicarDescompte(preu)));
    
        
    </script>
</body>

</html>

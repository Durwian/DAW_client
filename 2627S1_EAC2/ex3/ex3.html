<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Celcius-Farenheit</title>
    <script type="module" src="./ex3.js"></script>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    </head>
<body>
    <h1>Calculadora Celcius-Farenheit</h1>
    <div class=" mb-5">
        <input type="text" name="numero" id="numero" class="col-4 m-4" placeholder="Introdueix un nombre...">
        <div>
            <button type="submit" class="m-4 btn btn-secondary" id="btnCelcius" style="padding: 5px;">A Celcius</button>
            <button type="submit" class="m-4 btn btn-secondary" id="btnFarenheit" style="padding: 5px;">A Farenheit</button>
        </div>
        <fieldset disabled="disabled" class="m-4">
            <h3>Resultat:</h3>
            <input type="text" id="resultat" >
        </fieldset>
    </div>
</body>
</html>

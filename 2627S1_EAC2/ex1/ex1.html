<body>

    <h1>Afegir elements a la llista</h1>

        <input type="text" name="text" id="text" placeholder="Escriu aluna cosa...">
        <ul id="llista">
            <li id="actual"></li>
        </ul>
  
    <script>
        let text = document.getElementById('text');
        let llista = document.getElementById('llista');
        let actual = document.getElementById('actual');
        const regex = '[0-9]+';
        
        //cada cop que apretem una tecla i per tan canviem el contingut, afegeix al <li> i comprova el color.
        text.addEventListener('input',()=>{
            actual.textContent = text.value;
            if(text.value.trim().length < 5){
                actual.style.color = "green";
            }
            if(text.value.trim().length > 5){
                 actual.style.color = "blue";
            }
            if(text.value.match(regex)){
                 actual.style.color = "red";
            }          
        });

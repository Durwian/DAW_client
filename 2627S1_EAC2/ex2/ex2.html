<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EAC2 - Ex2</title>
</head>
<body>
    <h1>Formulari</h1>
    <form action="#" method="POST">
        <label for="nom">Nom:</label>
        <input type="text" name="nom" id="nom">
        <label for="cognom">Cognom:</label>
        <input type="text" name="cognom" id="cognom">
        <label for="dataNaix">Data Naixment:</label>
        <input type="text" name="dataNaix" id="dataNaix">
    
        <ul id="missatge"></ul>
        <button type="submit" id="registrar">Registrar</button>
    </form>
    <script>
        let campNom = document.getElementById('nom');
        let campCognom = document.getElementById('cognom');
        let campDataNaixement = document.getElementById('dataNaix');
        let missatge = document.getElementById('missatge');
        let registrar = document.getElementById('registrar');
        let regex = /^[0-9]{2}\/[0-9]{2}\/[0-9]{4}$/


        function validarNom(){
            if(campNom.value == ""){
                mostraNotificacio("nomNotif", 'El camp NOM no pot estar buit');
                campNom.style.borderColor = "red";
            }else{
                campNom.style.borderColor = "";
                return 0;
            }
        }

        function validarCognom(){
            if(campCognom.value == ""){
                mostraNotificacio("cognomNotif", "El camp COGNOM no pot estar buit");
                campCognom.style.borderColor = "red";
            }else{
                campCognom.style.borderColor = "";
                return 0;
            }
        }

        function validarDataNaixement(){
            if(campDataNaixement.value == ""){
                mostraNotificacio("naixementNotif", 'El camp DATA_NAIXMENT no pot estar buit');
                campDataNaixement.style.borderColor = "red";
            }else if(!campDataNaixement.value.match(regex)){
                mostraNotificacio("naixementFormat", 'El camp DATA_NAIXEMENT ha de tenir el següent format dd/mm/AAAA');
                campDataNaixement.style.borderColor = "red";
            }else{
                campDataNaixement.style.borderColor = "";
                return 0;
            }
        }

       function mostraNotificacio(camp, contingutMissatge){
            let element = document.getElementById(camp);
            if(element){
                if(contingutMissatge == ""){
                    element.remove();
                }else{
                    element.textContent = contingutMissatge;
                }
            }else if(contingutMissatge != ""){
                let li = document.createElement('li');
                li.id = camp;
                li.textContent = contingutMissatge;
                li.style.color = 'red';
                li.style.listStyle = "none";
                missatge.appendChild(li);
            }
        }



        function validarForm(){
            missatge.textContent = "";
            validarNom();
            validarCognom();
            validarDataNaixement();
            if(validarNom() == 0 && validarCognom() == 0 && validarDataNaixement() == 0){
                missatge.style.color = "green";
                missatge.textContent = "Formulari enviat!"
            }
        }



        registrar.addEventListener('click',(e)=>{
            e.preventDefault();
            validarForm();
        });

    </script>
</body>
</html>

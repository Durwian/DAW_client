<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EAC2 - Ex4</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>
<body>
    <form action="" method="post" class="form  p-4 col-6" >
        <label for="nom" class="form-label">Nom:</label>
        <input type="text" class="form-control" name="nom" id="nom" placeholder="Nom d'usuari" >
        <span class="error form-text"></span>
        <label for="edat" class="form-label">Edat:</label>
        <input type="number" class="form-control" name="edat" id="edat" placeholder="Més gran o igual a 18">
        <span class="error"></span>
        <label for="codi" class="form-label">Codi promoció:</label>
        <input type="text" class="form-control" name="codi" id="codi" placeholder="Ex: AAAA26">
        <span class="error"></span>
        <button type="submit" id="btnEnviar"class="mt-4 btn secondary">Enviar</button>
    </form>

    <style>
        .input-error{
            border-color: red;         
        }
        .error{
            display: block;
            color: red;
        }
    </style>
    <script type="module" src="./ex4.js"></script>
</body>
</html>
